name: Sync GridCraft upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hmmrlabs-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'hmmrlabs/gridcraft' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into temporary checkout
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags https://github.com/storytold/gridcraft.git main
          upstream=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Fork already contains upstream main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-ff --no-commit "$upstream"; then
            echo 'Upstream merge conflicts. Main and deployment were not changed. Resolve manually.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
      - name: Install Linux build dependencies
        if: steps.merge.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      - name: Install Rust
        if: steps.merge.outputs.changed == 'true'
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.merge.outputs.changed == 'true'
      - name: Full quality gate on merged tree
        if: steps.merge.outputs.changed == 'true'
        run: cargo xtask ci
      - name: Publish tested merge
        if: steps.merge.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream }}
        run: |
          set -euo pipefail
          git commit -m "M1.6: merge GridCraft upstream ${UPSTREAM_SHA:0:12}"
          # Normal push rejects a race with another main update. Never force push.
          git push origin HEAD:main
          echo "Merged and tested upstream $UPSTREAM_SHA. Viewer freshness workflow will pick up this revision." >> "$GITHUB_STEP_SUMMARY"
